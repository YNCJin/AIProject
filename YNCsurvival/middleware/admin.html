<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamDirector 관리</title>
<style>
    :root { --bg: #0b0d22; --panel: #161936; --line: #2a2d55; --text: #e8e2f0; --dim: #8a82a8; --gold: #ffd27a; --on: #4caf7d; --off: #6b6680; --bad: #e57373; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { color: var(--gold); font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--dim); margin: 0 0 24px; font-size: 14px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .source { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .source:first-of-type { border-top: 0; }
    .name { font-weight: bold; width: 80px; }
    .state { flex: 1; font-size: 13px; color: var(--dim); }
    .state b { color: var(--text); font-weight: normal; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--off); }
    .dot.ok { background: var(--on); }
    .dot.bad { background: var(--bad); }
    button { background: #2b2f5e; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; font: inherit; font-size: 14px; }
    button:hover { background: #3a3f78; }
    button.primary { background: #c58a2e; border-color: #c58a2e; color: #1a1030; font-weight: bold; }
    .toggle { min-width: 64px; }
    .toggle.on { background: var(--on); border-color: var(--on); color: #0b0d22; font-weight: bold; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 14px; min-width: 0; }
    input.user { width: 110px; } input.amount { width: 110px; } input.text { flex: 1; min-width: 140px; }
    .hint { font-size: 13px; color: var(--dim); margin: 8px 0 0; }
    .error { color: var(--bad); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<main>
    <h1>StreamDirector 관리</h1>
    <p class="sub">채팅 출처를 켜고 끄면 바로 적용됩니다. 접속한 게임 화면: <b id="clients">-</b>개</p>

    <section>
        <h2>채팅 출처</h2>
        <div class="source">
            <span class="name">치지직</span>
            <span class="state" id="chzzk-state">-</span>
            <span id="chzzk-actions"></span>
            <button class="toggle" data-source="chzzk">-</button>
        </div>
        <div class="error" id="chzzk-error"></div>
        <div class="source">
            <span class="name">Discord</span>
            <span class="state" id="discord-state">-</span>
            <button class="toggle" data-source="discord">-</button>
        </div>
        <div class="source">
            <span class="name">더미</span>
            <span class="state">1~3초마다 가짜 채팅</span>
            <button class="toggle" data-source="dummy">-</button>
        </div>
    </section>

    <section>
        <h2>테스트 전송</h2>
        <form id="chat-form">
            <input class="user" name="user" value="테스터" required>
            <input class="text" name="text" placeholder="채팅 내용" required>
            <button>채팅 보내기</button>
        </form>
        <form id="donation-form">
            <input class="user" name="user" value="후원자" required>
            <input class="amount" name="amount" type="number" min="0" step="1000" value="10000" required>
            <input class="text" name="text" placeholder="후원 메시지">
            <button>후원 보내기</button>
        </form>
        <p class="hint">후원을 보내면 게임에서 재의 나방 여왕이 소환됩니다 (금액이 클수록 강함).</p>
    </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const dot = (cls) => `<span class="dot ${cls}"></span>`;

async function api (path, body) {
    const res = await fetch(path, body === undefined ? {} : {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    return res.json();
}

function render (s) {
    $('clients').textContent = s.clients;

    document.querySelectorAll('.toggle').forEach((btn) => {
        const on = s[btn.dataset.source].enabled;
        btn.textContent = on ? 'ON' : 'OFF';
        btn.classList.toggle('on', on);
    });

    const d = s.discord;
    $('discord-state').innerHTML = !d.configured ? `${dot('')}토큰 없음 (.env 의 DISCORD_BOT_TOKEN)`
        : d.connected ? `${dot('ok')}<b>연결됨</b>` : `${dot('bad')}연결 중 / 실패 (서버 로그 확인)`;

    const c = s.chzzk;
    let state, actions = '';
    if (!c.configured) state = `${dot('')}설정 없음 (.env 의 CHZZK_CLIENT_ID / SECRET)`;
    else if (!c.authorized) { state = `${dot('')}로그인 필요`; actions = '<button class="primary" id="chzzk-login">치지직 연결</button>'; }
    else if (c.connected) { state = `${dot('ok')}<b>연결됨 - 채팅·후원 수신 중</b>`; actions = '<button id="chzzk-logout">연결 해제</button>'; }
    else { state = `${dot('bad')}연결 시도 중`; actions = '<button id="chzzk-logout">연결 해제</button>'; }
    $('chzzk-state').innerHTML = state;
    $('chzzk-actions').innerHTML = actions;
    $('chzzk-error').textContent = c.error || '';
}

async function refresh () {
    try { render(await api('/sources')); } catch { /* 서버가 꺼진 경우 */ }
}

document.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.classList.contains('toggle')) {
        const on = !t.classList.contains('on');
        render(await api('/sources', { [t.dataset.source]: on }));
    } else if (t.id === 'chzzk-login') {
        window.open('/chzzk/login', 'chzzk-login', 'width=520,height=720');
    } else if (t.id === 'chzzk-logout') {
        if (confirm('치지직 연결을 해제할까요? 저장된 로그인 정보가 삭제됩니다.')) render(await api('/chzzk/logout', {}));
    }
});

$('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await api('/chat', { user: f.get('user'), text: f.get('text') });
    e.target.text.value = '';
});

$('donation-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await api('/donation', { user: f.get('user'), amount: Number(f.get('amount')), text: f.get('text') || '' });
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
